name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # SỬA LỖI CI: action bên thứ 3 "android-actions/setup-android@v3" đang bị GitHub ép
      # chạy trên Node.js 24 (GitHub đã khai tử Node 20 từ 19/9/2025 - xem annotation cảnh báo
      # của chính GitHub trên các lần chạy trước) trong khi action đó viết cho Node 20, nên nó
      # crash ngay khi khởi động (job fail trong có 23 giây, đúng ngay bước này) - KHÔNG liên
      # quan gì tới code Kotlin của app. Thay bằng cách tự tải "cmdline-tools" THẲNG TỪ GOOGLE
      # (không qua action bên thứ 3 nào cả) - cách này không phụ thuộc việc 1 action ngoài có
      # được tác giả cập nhật kịp theo Node mới hay không nữa.
      - name: Cài Android SDK (tải thẳng cmdline-tools từ Google, không qua action bên thứ 3)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Chấp nhận license SDK + cài đúng platform 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # assembleDebug / assembleRelease build TẤT CẢ flavor (direct + ggplay).
      - name: Build APK Debug (mọi flavor)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build APK Release (mọi flavor, không minify, ký bằng keystore commit sẵn trong repo)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Tìm file APK vừa build
        run: find app/build/outputs -iname "*.apk"

      # Đặt tên APK + artifact theo PHIÊN BẢN + SỐ LẦN CHẠY + MÃ COMMIT để biết ngay file nào là
      # của bản nào (trước đây tên cố định "VNSmartKey-apk", tải nhiều lần dễ lẫn).
      - name: Đặt tên APK theo phiên bản + commit
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -1)
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p dist
          find app/build/outputs/apk -iname "*.apk" | while read -r f; do
            variant=$(basename "$f" .apk)   # vd: app-direct-debug
            variant="${variant#app-}"       # vd: direct-debug
            cp "$f" "dist/VNSmartKey-v${VERSION_NAME}-${variant}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          done
          ls -la dist
          echo "ARTIFACT_NAME=VNSmartKey-v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Tải APK lên làm Artifact của lần chạy này
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*.apk
          if-no-files-found: error
